[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-shield-api"
version = "1.0.0"
description = "Autonomous AI Prompt Injection & Security Gateway with native Stripe monetization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SvvBot & Aegis-1 Systems", email = "svvbot@users.noreply.github.com" },
]
keywords = [
    "prompt-injection",
    "ai-security",
    "jailbreak-detection",
    "stripe",
    "micro-saas",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
